<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LinFan">
  <g>
    <!-- three swept blades, rotated 120° -->
    <g fill="#38BDF8">
      <path d="M100 100 C122 88 126 54 100 30 C84 50 84 80 100 100 Z" transform="rotate(0 100 100)"/>
      <path d="M100 100 C122 88 126 54 100 30 C84 50 84 80 100 100 Z" transform="rotate(120 100 100)"/>
      <path d="M100 100 C122 88 126 54 100 30 C84 50 84 80 100 100 Z" transform="rotate(240 100 100)"/>
    </g>
    <!-- blade spine: shading crease, inner end covered by the hub -->
    <g fill="none" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round">
      <path d="M100 100 C102.6 85.9 104.5 59.4 101.5 38.3" transform="rotate(0 100 100)"/>
      <path d="M100 100 C102.6 85.9 104.5 59.4 101.5 38.3" transform="rotate(120 100 100)"/>
      <path d="M100 100 C102.6 85.9 104.5 59.4 101.5 38.3" transform="rotate(240 100 100)"/>
    </g>
    <!-- hub -->
    <circle cx="100" cy="100" r="14" fill="#38BDF8"/>
    <circle cx="100" cy="100" r="6.5" fill="#0EA5E9"/>
  </g>
</svg>
